[project]
name = "deepgram-webinar-demo"
version = "0.1.0"
description = "Deepgram Flux + GPT-5.6 Luna voice agent built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[daily,deepgram,openai,runner,webrtc]==1.11.0",
    "pipecatcloud>=1.2.0",
]

[dependency-groups]
dev = [
    # `pipecat eval`, for the behavioral evals in evals/
    "pipecat-ai[cli]==1.11.0",
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]